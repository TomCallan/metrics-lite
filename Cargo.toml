[package]
name = "metrics-lite"
version = "0.1.0"
edition = "2021"
description = "Lightweight multi-project push metrics + chart UI (Prometheus scrape compat)"
license = "MIT"

[[bin]]
name = "metrics-lite"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors"] }
flate2 = "1"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metrics-lite</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 12px 16px; background: #1e293b; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: #38bdf8; }
  select, button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.active { background: #0284c7; border-color: #0284c7; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  #cards { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .card { background: #1e293b; border-radius: 8px; padding: 10px 14px; min-width: 180px; }
  .card .k { font-size: 12px; color: #94a3b8; }
  .card .v { font-size: 20px; font-weight: 700; }
  #chartWrap { background: #1e293b; border-radius: 8px; padding: 12px; }
  #chart { width: 100%; height: 440px; }
  pre { background: #020617; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { font-size: 12px; color: #94a3b8; }
  #hint { font-size: 12px; color: #64748b; margin-top: 8px; }
  #logpane { display: none; }
  #logcontrols { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; font-size: 13px; }
  #logcontrols input[type="text"], #logcontrols select { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 10px; }
  #logview { background: #020617; border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12px; max-height: 560px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  #logview .ts { color: #64748b; }
  #logview .lv-info { color: #94a3b8; }
  #logview .lv-warn { color: #fbbf24; }
  #logview .lv-error { color: #f87171; font-weight: 700; }
  #logview .lv-debug { color: #22d3ee; }
</style>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<header>
  <h1>metrics<span>-lite</span></h1>
  <label>project <select id="project"><option value="">--</option></select></label>
  <label>metric <select id="metric"><option value="">--</option></select></label>
  <span class="row" id="ranges">
    <button data-secs="900">15m</button>
    <button data-secs="3600" class="active">1h</button>
    <button data-secs="21600">6h</button>
    <button data-secs="86400">24h</button>
    <button data-secs="0">all</button>
  </span>
  <label><input type="checkbox" id="autorefresh" checked> auto 5s</label>
  <span class="row" id="tabs">
    <button data-view="charts" class="active">charts</button>
    <button data-view="logs">logs</button>
  </span>
  <span id="status"></span>
</header>
<main>
  <div id="cards"></div>
  <div id="chartWrap"><div id="chart"></div></div>
  <div id="hint">hover for crosshair + values &bull; scroll to zoom &bull; drag to pan &bull; slider below for range &bull; toolbox for zoom-select / restore / save</div>
  <div id="logpane">
    <div id="logcontrols">
      <label><input type="checkbox" class="lvf" value="debug"> debug</label>
      <label><input type="checkbox" class="lvf" value="info" checked> info</label>
      <label><input type="checkbox" class="lvf" value="warn" checked> warn</label>
      <label><input type="checkbox" class="lvf" value="error" checked> error</label>
      <input type="text" id="logq" placeholder="filter text…">
      <label>lines <select id="loglimit"><option>200</option><option selected>500</option><option>1000</option><option>2000</option></select></label>
      <label><input type="checkbox" id="logpause"> pause</label>
    </div>
    <div id="logview"></div>
    <div id="hint">push via POST /api/v1/logs/&lt;project&gt; (JSON, JSONL, or plain text lines) &bull; newest at bottom</div>
  </div>
  <h3>Push examples</h3>
  <pre id="snippet"></pre>
  <h3>Series</h3>
  <pre id="series"></pre>
</main>
<script>
let chart = null;
let rangeSecs = 3600;
let timer = null;

function palette(i) {
  const c = ['#38bdf8','#a78bfa','#34d399','#fbbf24','#f472b6','#22d3ee','#fb7185','#a3e635'];
  return c[i % c.length];
}

function seriesLabel(s, fallback) {
  return Object.entries(s.labels).map(([k, v]) => k + '=' + v).join(',') || fallback;
}

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}

async function loadProjects() {
  const d = await jget('/api/v1/projects');
  const sel = document.getElementById('project');
  const cur = sel.value;
  sel.innerHTML = d.projects.map(p => `<option>${p}</option>`).join('') || '<option value="">--</option>';
  if (d.projects.includes(cur)) sel.value = cur;
  updateSnippet();
}

async function loadMetrics() {
  const p = document.getElementById('project').value;
  if (!p) return;
  const d = await jget('/api/v1/metrics?project=' + encodeURIComponent(p));
  const sel = document.getElementById('metric');
  const cur = sel.value;
  sel.innerHTML = d.metrics.map(m => `<option>${m}</option>`).join('') || '<option value="">--</option>';
  if (d.metrics.includes(cur)) sel.value = cur;
  updateSnippet();
}

function updateSnippet() {
  const p = document.getElementById('project').value || 'demo';
  const m = document.getElementById('metric').value || 'live_equity';
  document.getElementById('snippet').textContent =
`# JSON push
curl -X POST http://host:3100/api/v1/push/${p} \\
  -H 'Content-Type: application/json' \\
  -d '{"metric":"${m}","value":14726.78,"labels":{"symbol":"XAU"}}'

# Prometheus-text push
printf 'live_up 1\\nfeed_mid{symbol="XAU"} 2650.1\\n' | \\
  curl -X POST http://host:3100/api/v1/push/${p} \\
    -H 'Content-Type: text/plain' --data-binary @-

# Query
curl 'http://host:3100/api/v1/query?project=${p}&metric=${m}&from=-3600'

# Bulk pipe (JSONL + gzip handled server-side)
some-producer | mlpush ${p}   # scripts/mlpush in the metrics-lite repo`;
}

function baseOption() {
  return {
    backgroundColor: 'transparent',
    animation: false,
    textStyle: { color: '#e2e8f0', fontFamily: 'system-ui, sans-serif' },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', label: { show: true } },
      valueFormatter: v => (typeof v === 'number' ? v : v),
    },
    legend: { textStyle: { color: '#e2e8f0' } },
    grid: { left: 64, right: 24, top: 40, bottom: 64 },
    xAxis: { type: 'time', axisLabel: { color: '#94a3b8' } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } } },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
      { type: 'slider', xAxisIndex: 0, filterMode: 'none', height: 24, bottom: 8, textStyle: { color: '#94a3b8' } },
    ],
    toolbox: {
      show: true,
      right: 8,
      iconStyle: { borderColor: '#94a3b8' },
      feature: {
        dataZoom: { yAxisIndex: false, title: { zoom: 'zoom-select', back: 'zoom-reset' } },
        restore: { title: 'reset' },
        saveAsImage: { title: 'save png', backgroundColor: '#1e293b' },
      },
    },
    series: [],
  };
}

function ensureChart() {
  if (chart) return true;
  if (typeof echarts === 'undefined') {
    document.getElementById('chartWrap').innerHTML = '<p>ECharts CDN unreachable (offline?). Data still available via API. Cards above show latest values.</p>';
    return false;
  }
  chart = echarts.init(document.getElementById('chart'));
  chart.setOption(baseOption());
  window.addEventListener('resize', () => chart && chart.resize());
  return true;
}

async function refresh(resetZoom) {
  const p = document.getElementById('project').value;
  const m = document.getElementById('metric').value;
  if (!p || !m) { document.getElementById('status').textContent = 'select project + metric'; return; }
  const now = Math.floor(Date.now() / 1000);
  const from = rangeSecs === 0 ? 0 : now - rangeSecs;
  const url = `/api/v1/query?project=${encodeURIComponent(p)}&metric=${encodeURIComponent(m)}&from=${from}&to=${now}`;
  let d;
  try { d = await jget(url); }
  catch (e) { document.getElementById('status').textContent = 'query error: ' + e.message; return; }
  const series = d.series && d.series.length ? d.series : [{ labels: {}, points: d.points }];
  document.getElementById('status').textContent = `${series.length} series, updated ${new Date().toLocaleTimeString()}`;
  document.getElementById('series').textContent = series.map(s => JSON.stringify(s.labels) + ' n=' + s.points.length).join('\n');
  // latest-value cards
  const cards = series.map(s => {
    const last = s.points.length ? s.points[s.points.length - 1] : null;
    const lbl = Object.entries(s.labels).map(([k, v]) => k + '=' + v).join(',') || '(no labels)';
    const prev = s.points.length > 1 ? s.points[s.points.length - 2][1] : null;
    const delta = (last && prev !== null) ? ` <span style="font-size:12px;color:#94a3b8">(Δ ${last[1] - prev})</span>` : '';
    return `<div class="card"><div class="k">${m} {${lbl}}</div><div class="v">${last ? last[1] : '—'}${delta}</div></div>`;
  }).join('');
  document.getElementById('cards').innerHTML = cards;
  // chart
  if (!ensureChart()) return;
  // preserve user zoom/pan across auto-refresh unless a range change asked for reset
  let zoomOpt = {};
  if (!resetZoom) {
    try {
      const dz = chart.getOption().dataZoom;
      if (dz && dz[0] && (dz[0].start > 0 || dz[0].end < 100)) {
        zoomOpt = { start: dz[0].start, end: dz[0].end };
      }
    } catch (e) { /* fresh chart, nothing to preserve */ }
  }
  chart.setOption({
    legend: { data: series.map(s => seriesLabel(s, m)) },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none', ...zoomOpt },
      { type: 'slider', xAxisIndex: 0, filterMode: 'none', height: 24, bottom: 8, textStyle: { color: '#94a3b8' }, ...zoomOpt },
    ],
    series: series.map((s, i) => ({
      name: seriesLabel(s, m),
      type: 'line',
      showSymbol: false,
      sampling: 'lttb',
      emphasis: { focus: 'series' },
      itemStyle: { color: palette(i) },
      lineStyle: { color: palette(i), width: 1.5 },
      data: s.points.map(([ts, v]) => [ts * 1000, v]),
    })),
  });
}

document.getElementById('project').addEventListener('change', async () => { await loadMetrics(); await refresh(true); });
document.getElementById('metric').addEventListener('change', () => refresh(true));
document.getElementById('ranges').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#ranges button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  rangeSecs = parseInt(e.target.dataset.secs, 10);
  refresh(true);
});
document.getElementById('autorefresh').addEventListener('change', setupTimer);
function setupTimer() {
  if (timer) clearInterval(timer);
  if (document.getElementById('autorefresh').checked) timer = setInterval(tick, 5000);
}
function tick() {
  if (currentView === 'logs') refreshLogs();
  else refresh(false);
}

let currentView = 'charts';
document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentView = e.target.dataset.view;
  const logs = currentView === 'logs';
  document.getElementById('logpane').style.display = logs ? 'block' : 'none';
  document.getElementById('chartWrap').style.display = logs ? 'none' : 'block';
  document.getElementById('cards').style.display = logs ? 'none' : 'flex';
  if (logs) refreshLogs();
  else { if (chart) chart.resize(); refresh(false); }
});

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function refreshLogs() {
  const p = document.getElementById('project').value;
  if (!p) { document.getElementById('status').textContent = 'select project'; return; }
  if (document.getElementById('logpause').checked) return;
  const levels = [...document.querySelectorAll('.lvf:checked')].map(c => c.value).join(',');
  const q = document.getElementById('logq').value;
  const limit = document.getElementById('loglimit').value;
  const params = new URLSearchParams({ project: p, limit });
  if (levels) params.set('levels', levels);
  if (q) params.set('q', q);
  let d;
  try { d = await jget('/api/v1/logs?' + params.toString()); }
  catch (e) { document.getElementById('status').textContent = 'logs error: ' + e.message; return; }
  const view = document.getElementById('logview');
  view.innerHTML = d.lines.map(l =>
    `<span class="ts">${new Date(l.ts * 1000).toLocaleTimeString()}</span> <span class="lv-${esc(l.level)}">${esc(l.level.toUpperCase().padEnd(5))}</span> ${esc(l.msg)}`
  ).join('\n') || '<span class="ts">no lines (push via POST /api/v1/logs/' + esc(p) + ')</span>';
  view.scrollTop = view.scrollHeight;
  document.getElementById('status').textContent = `${d.lines.length} lines, updated ${new Date().toLocaleTimeString()}`;
}
document.getElementById('logq').addEventListener('input', () => refreshLogs());
document.querySelectorAll('.lvf').forEach(c => c.addEventListener('change', () => refreshLogs()));
document.getElementById('loglimit').addEventListener('change', () => refreshLogs());

(async () => {
  await loadProjects();
  await loadMetrics();
  await refresh(true);
  setupTimer();
  setInterval(async () => { // refresh dropdowns every 30s for new projects
    const p = document.getElementById('project').value;
    await loadProjects();
    if (p) { document.getElementById('project').value = p; }
  }, 30000);
})();
</script>
</body>
</html>
